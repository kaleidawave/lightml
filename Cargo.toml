[package]
name = "lightml"
description = "LIGhtweight-HTML parser and with CSS selector interface"
version = "0.0.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/kaleidawave/lightml"
keywords = ["HTML", "parser", "selector"]
categories = ["parsing", "web-programming"]

[features]
markdown_code_blocks_in_html = []

[lib]
crate-type = ["cdylib", "rlib"]

[[test]]
name = "specification"
harness = false

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
js-sys = "0.3"

[dev-dependencies]
codespan-reporting = "0.12.0"
simple-markdown-parser = "0.0.7"
pretty_assertions = "1.4.1"

[lints.clippy]
pedantic = "deny"
