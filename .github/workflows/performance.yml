name: Run performance benchmarks on different pieces

on:
  push

jobs:
  test-binaries:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
          fetch-tags: true

      # TODO abstract
      - name: Download shell-language
        run: |
          mkdir bin
          gh release download -R kaleidawave/experiments assets -p shell-language -D bin
          ls -R .
          chmod +x ./bin/shell-language
          echo "$(pwd)/bin" >> "$GITHUB_PATH"
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: brndnmtthws/rust-action-cargo-binstall@v1
        with:
          packages: hyperfine

      - name: Get file
        run: curl -sS $URL > out.html
        env:
          URL: "https://www.bbc.co.uk/news"

      - name: (temp) check things
        run: git log
      
      - name: Build binaries
        run: |
          for tags "performance/*" each
            echo "Checking out $tag"
            git checkout tags/$tag
            let status = git log -n 1
            echo $status
            cargo build --release --example parse
            move ./target/release/examples/parse "binaries/parse-$tag"
        shell: shell-language {0}

      - name: (temp) check things
        run: ls -R .

      - name: Compare binaries
        run: |
          let binaries = files "binaries/*"
          echo $binaries
          let binaries = replace $binaries "\n" ","
          echo $binaries
          hyperfine -i -L compiler $binaries '{compiler} $FILE --check'
        shell: shell-language {0}
        env:
          FILE: "out.html"